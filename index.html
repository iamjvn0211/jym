<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F7F9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B0F1A" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Jym">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Jym</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: one narrow column built for a thumb. Header with week range and
   arrows, a 7-day strip, weekly targets, then the selected day's checklist.
   Categories use weight-plate colours: red strength, blue cardio, green mobility. */
:root {
  --bg: #F3F5FA;
  --surface: #FFFFFF;
  --ink: #101828;
  --muted: #566074;
  --line: #E4E7EC;
  --acc: #2457F5; --acc2: #FF6B57; --onacc: #FFFFFF;
  --str: #2457F5;
  --car: #FF6B57;
  --mob: #344054;
  --onplate: #ffffff; --gold: #FF6B57;
  --font-display: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B0F1A; --surface: #151B2B; --ink: #F2F4F8; --muted: #A3ACBF; --line: #262E44;
    --acc: #6E93FF; --acc2: #FF8A7A; --onacc: #0B0F1A;
    --str: #6E93FF; --car: #FF8A7A; --mob: #C7D0E0; --onplate: #0B0F1A; --gold: #FF8A7A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B0F1A; --surface: #151B2B; --ink: #F2F4F8; --muted: #A3ACBF; --line: #262E44;
  --acc: #6E93FF; --acc2: #FF8A7A; --onacc: #0B0F1A;
  --str: #6E93FF; --car: #FF8A7A; --mob: #C7D0E0; --onplate: #0B0F1A; --gold: #FF8A7A;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.4;
  padding-block: 20px 96px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

.app { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

/* header */
.eyebrow { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.weekrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 2px; }
h1 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 48px; line-height: 1; letter-spacing: 0.01em; text-transform: uppercase; text-wrap: balance; min-width: 0; }
.nav { display: flex; gap: 8px; flex: none; }
.iconbtn { width: 44px; height: 44px; display: grid; place-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }
.iconbtn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.linkbtn { margin-top: 8px; padding: 6px 0; background: none; border: 0; font-size: 14px; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }

/* day strip */
.strip { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.daybtn { min-height: 68px; padding: 8px 0 8px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }
.daybtn .dn { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.daybtn .dd { font-family: var(--font-display); font-weight: 700; font-size: 24px; line-height: 1; font-variant-numeric: tabular-nums; }
.daybtn.today .dd { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 4px; }
.daybtn .dbar { width: 60%; height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.daybtn .dbar i { display: block; height: 100%; background: var(--ink); }
.daybtn.rest .dbar { opacity: 0.45; }
.daybtn[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.daybtn[aria-pressed="true"] .dn { color: var(--bg); opacity: 0.8; }
.daybtn[aria-pressed="true"] .dbar { background: color-mix(in srgb, var(--bg) 30%, transparent); }
.daybtn[aria-pressed="true"] .dbar i { background: var(--bg); }
.daybtn[aria-pressed="true"]:focus-visible { outline-color: var(--ink); outline-offset: 3px; }

/* panels */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
h2 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 22px; line-height: 1.1; letter-spacing: 0.04em; text-transform: uppercase; }
.sub { margin: 2px 0 0; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* targets */
.targets { display: flex; flex-direction: column; gap: 12px; }
.tgt { display: grid; grid-template-columns: 76px minmax(0, 1fr) auto; align-items: center; gap: 12px; }
.tgt .tl { font-size: 14px; font-weight: 600; }
.tgt .track { height: 10px; background: var(--line); border-radius: 5px; overflow: hidden; }
.tgt .track i { display: block; height: 100%; background: var(--c); border-radius: 5px; transition: width 0.25s ease; }
.tgt .tv { font-size: 14px; font-variant-numeric: tabular-nums; text-align: right; min-width: 92px; color: var(--muted); }
.tgt .tv b { color: var(--ink); font-weight: 600; }
.tgt.str { --c: var(--str); } .tgt.car { --c: var(--car); } .tgt.mob { --c: var(--mob); }

/* activity list */
.listhead { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.listhead > div { min-width: 0; }
.ghost { flex: none; min-height: 40px; padding: 0 14px; background: transparent; border: 1px solid var(--line); border-radius: 6px; font-size: 14px; font-weight: 600; }
.ghost[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.row { display: flex; flex-wrap: wrap; align-items: stretch; border-bottom: 1px solid var(--line); }
.rowbtn { flex: 1; min-width: 0; min-height: 64px; padding: 10px 0; display: flex; align-items: center; gap: 14px; background: none; border: 0; text-align: left; }
.plate { --c: var(--str); flex: none; width: 38px; height: 38px; border-radius: 50%; border: 4px solid var(--c); display: grid; place-items: center; position: relative; transition: background 0.15s ease; }
.plate.str { --c: var(--str); } .plate.car { --c: var(--car); } .plate.mob { --c: var(--mob); }
.plate::before { content: ""; width: 8px; height: 8px; border-radius: 50%; border: 2px solid var(--c); }
.plate svg { position: absolute; width: 18px; height: 18px; stroke: var(--onplate); fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; opacity: 0; }
.rowbtn[aria-checked="true"] .plate { background: var(--c); }
.rowbtn[aria-checked="true"] .plate::before { opacity: 0; }
.rowbtn[aria-checked="true"] .plate svg { opacity: 1; }
.info { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.name { font-size: 17px; font-weight: 600; overflow-wrap: anywhere; }
.detail { font-size: 14px; color: var(--muted); overflow-wrap: anywhere; }
.rowbtn[aria-checked="true"] .name { text-decoration: line-through; text-decoration-thickness: 1.5px; color: var(--muted); }
.meta { flex: none; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; padding-left: 4px; }
.meta b { font-family: var(--font-display); font-weight: 700; font-size: 24px; color: var(--ink); }
.rowbtn[aria-checked="true"] .meta b { color: var(--muted); }
.rm { flex: none; width: 44px; align-self: center; height: 44px; margin-left: 4px; display: grid; place-items: center; background: none; border: 1px solid var(--line); border-radius: 6px; }
.rm svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; }
.hw { flex: none; width: 44px; height: 44px; align-self: center; margin-left: 4px; display: grid; place-items: center; background: none; border: 1px solid var(--line); border-radius: 6px; font-family: var(--font-display); font-weight: 700; font-size: 22px; line-height: 1; }
.hw[aria-expanded="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.how { flex: 0 0 100%; padding: 2px 0 16px 52px; display: flex; flex-direction: column; gap: 10px; font-size: 15px; }
.how ol { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.how .tip { margin: 0; color: var(--muted); }
.how .tip b { color: var(--ink); font-weight: 600; }
.how a { align-self: flex-start; min-height: 44px; display: inline-flex; align-items: center; color: var(--ink); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }

/* weight logging and bonus rows */
.wt { flex: 0 0 100%; padding: 0 0 12px 52px; display: flex; align-items: center; flex-wrap: wrap; gap: 6px 8px; font-size: 14px; }
.wt label { font-weight: 600; }
.wt input.wtin { width: 84px; min-height: 40px; padding: 0 10px; font-variant-numeric: tabular-nums; }
.wt .u { color: var(--muted); }
.wt .wh { color: var(--muted); font-size: 13px; }
.bonushead { flex: 0 0 100%; list-style: none; padding: 16px 0 8px; border-bottom: 1px solid var(--line); font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.row.bonus .plate { border-style: dashed; }

/* progress panel */
.progress { display: flex; flex-direction: column; gap: 20px; }
.progress h3 { margin: 0 0 6px; font-family: var(--font-display); font-weight: 700; font-size: 16px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.streak { display: flex; align-items: center; gap: 14px; }
.streak .big { font-family: var(--font-display); font-weight: 700; font-size: 64px; line-height: 0.9; font-variant-numeric: tabular-nums; }
.streak b { display: block; font-size: 17px; font-weight: 600; }
.streak .s { display: block; font-size: 14px; color: var(--muted); }
.weeks { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px; margin-top: 12px; }
.wkc { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
.wk { width: 100%; height: 36px; display: flex; align-items: flex-end; overflow: hidden; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; }
.wk i { display: block; width: 100%; background: var(--mob); opacity: 0.55; }
.wk.full i { opacity: 1; }
.wk.now { outline: 2px solid var(--ink); outline-offset: 1px; }
.wkc em { font-style: normal; font-size: 10px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.rows { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.r { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.r b { font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
.fine { margin: 8px 0 0; font-size: 13px; color: var(--muted); }
.line { margin: 0 0 8px; font-size: 15px; }
.lifts { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.lifts li { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.lifts .ln { overflow-wrap: anywhere; }
.lifts .lw, .lifts .ld { font-variant-numeric: tabular-nums; text-align: right; }
.lifts .ld { min-width: 72px; font-weight: 600; color: var(--muted); }
.lifts .ld.up { color: var(--mob); }
.badges { display: flex; flex-wrap: wrap; gap: 8px; }
.badge { padding: 7px 12px; border: 1px solid var(--line); border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--muted); }
.badge.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.bwrow { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; font-size: 14px; font-weight: 600; }
.progress input.bw { width: 84px; min-height: 40px; padding: 0 10px; }
.bwrow .u { font-weight: 400; color: var(--muted); }

/* reward toast */
.toast { position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; pointer-events: none; padding: 0 max(16px, env(safe-area-inset-right, 0px)) calc(76px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); z-index: 20; }
.toast .msg { max-width: 520px; padding: 12px 16px; background: var(--ink); color: var(--bg); border-radius: 8px; font-weight: 600; font-size: 15px; pointer-events: auto; }

/* tabs */
[hidden] { display: none !important; }
.tabpanel { display: flex; flex-direction: column; gap: 16px; }
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; background: var(--surface); border-top: 1px solid var(--line); padding: 6px max(16px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.tabs { max-width: 520px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.tab { min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; background: none; border: 0; border-radius: 6px; font-size: 13px; font-weight: 600; color: var(--muted); }
.tab svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tab[aria-selected="true"] { background: var(--ink); color: var(--bg); }
.tab[aria-selected="true"]:focus-visible { outline-color: var(--ink); outline-offset: 2px; }

/* strength chart and level picker */
.lchips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.lchips button { min-height: 36px; padding: 0 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; font-size: 13px; font-weight: 600; }
.lchips button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chart { display: block; width: 100%; height: auto; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .ln { stroke: var(--ink); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
.chart .proj { stroke: var(--muted); stroke-width: 2; stroke-dasharray: 4 4; }
.chart .pt { fill: var(--ink); }
.chart .gp { fill: var(--bg); stroke: var(--ink); stroke-width: 2; }
.chart text { fill: var(--muted); font-family: var(--font-body); font-size: 10px; }
.seg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.seg button { min-height: 44px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; font-size: 14px; font-weight: 600; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.bodystat { display: flex; align-items: center; gap: 14px; }
.bodystat .big { font-family: var(--font-display); font-weight: 700; font-size: 56px; line-height: 0.9; font-variant-numeric: tabular-nums; }
.bodystat b { display: block; font-size: 17px; font-weight: 600; }
.bodystat .s { display: block; font-size: 14px; color: var(--muted); }
.gbar { height: 14px; background: var(--bg); border: 1px solid var(--line); border-radius: 999px; overflow: hidden; margin-top: 10px; }
.gbar i { display: block; height: 100%; background: var(--mob); border-radius: 999px; }
.eqcard { padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
.eqcard .eq { font-family: var(--font-display); font-weight: 700; font-size: 26px; line-height: 1.1; }
.bform { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
.bform label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; color: var(--muted); }
.bform .wide { grid-column: 1 / -1; }
.gridrow { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; align-items: end; }
.gridrow label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; color: var(--muted); }
.chart .tg { stroke: var(--mob); stroke-width: 2; stroke-dasharray: 4 4; }
.chart .gd { fill: var(--bg); stroke: var(--mob); stroke-width: 2; }
.chart .bpt { fill: var(--ink); }
.macro3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.macro3 > div { padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); font-size: 13px; color: var(--muted); }
.macro3 b { display: block; font-family: var(--font-display); font-size: 24px; color: var(--ink); }
.you { display: flex; flex-direction: column; gap: 10px; }
.empty { padding: 18px 0; color: var(--muted); font-size: 15px; }
.primary { min-height: 50px; padding: 0 18px; background: var(--ink); color: var(--bg); border: 0; border-radius: 6px; font-size: 16px; font-weight: 600; }
.editextra { display: flex; }
.editextra .ghost { flex: 1; }

/* ===== NUTRITION CSS ===== */
.nrow { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; font-weight: 600; margin-top: 10px; }
.nrow b { font-variant-numeric: tabular-nums; }
.nbar { height: 8px; margin-top: 4px; background: var(--line); border-radius: 4px; overflow: hidden; }
.nbar i { display: block; height: 100%; background: var(--mob); border-radius: 4px; }
.meals { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.meal { border: 1px solid var(--line); border-radius: 8px; background: var(--bg); padding: 10px; }
.mtop { display: flex; align-items: center; gap: 10px; }
.mchk { flex: none; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: var(--surface); border: 2px solid var(--ink); border-radius: 6px; padding: 0; }
.mchk svg { width: 24px; height: 24px; stroke: var(--bg); fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.mchk[aria-pressed="true"] { background: var(--ink); }
.mtx { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.mtx .ml { font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.mtx b { font-size: 16px; font-weight: 600; }
.mtx b i { font-style: normal; font-weight: 400; color: var(--muted); font-size: 13px; }
.mtx .mm { font-size: 13px; color: var(--muted); }
.mhow { min-height: 44px; }
.mdet { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); font-size: 14px; }
.mdet p { margin: 0 0 8px; }
.stars { font-size: 30px; letter-spacing: 3px; color: var(--muted); vertical-align: middle; }
.stars .on { color: var(--gold); }
.progress h3.wb-h { font-family: var(--font-display); font-weight: 700; font-size: 40px; line-height: 1; letter-spacing: 0.01em; text-transform: none; color: var(--ink); margin: 2px 0 8px; }
.hero .hi { margin: 0; font-size: 14px; color: var(--muted); }
.wb.t { fill: var(--str); }
.wb.n { fill: var(--mob); }
.legend { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; font-size: 13px; color: var(--muted); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 8px; vertical-align: -1px; }
.legend .lt { background: var(--str); }
.legend .ln2 { background: var(--mob); }
.quote { margin: 0; padding: 12px 14px; border-left: 4px solid var(--gold); background: var(--bg); border-radius: 0 8px 8px 0; font-size: 16px; font-style: italic; }
.chart .band { fill: var(--mob); opacity: 0.18; }
.legend .lp { background: var(--ink); border-radius: 50%; }
.legend .ls { background: var(--ink); height: 3px; vertical-align: 3px; }
.legend .ld2 { background: var(--mob); opacity: 0.6; }
.seg.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
/* ===== END NUTRITION CSS ===== */
/* form */
form { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
form label.f { display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600; }
form .hint { font-weight: 400; color: var(--muted); }
input[type="text"], input[type="number"], select { min-height: 46px; width: 100%; padding: 0 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; }
fieldset { margin: 0; padding: 0; border: 0; min-width: 0; }
legend { padding: 0; margin-bottom: 6px; font-size: 14px; font-weight: 600; }
.chips { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.chip { position: relative; display: block; }
.chip input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.chip span { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; font-size: 15px; font-weight: 600; }

  /* ===== slacking check: missed training or food logging ===== */

  function renderTargets() {

  /* ---------- weights, calories, streaks ---------- */
  function fmtN(n) { return String(Math.round(n * 100) / 100); }

  function round5(n) { return Math.max(5, Math.round(n / 5) * 5); }
  function metFor(a) { return MET[a.name] || (a.cat === 'car' ? 6 : a.cat === 'mob' ? 2.5 : 4); }

  }

    var cur = logs[wk] || {}, cr = [];
    Object.keys(cur).forEach(function (n) {

    for (var i = keys.length - 1; i >= 0; i--) {
      var o = logs[keys[i]] || {}, r = recs[keys[i]] || {}, ratios = [];
      Object.keys(o).forEach(function (n) {

        if (SPEC[n] && w > 0 && s > 0) ratios.push(w / s);

  // Suggestion for a lift in week wk, using only what you logged in earlier weeks.

  // Remember what was suggested at the moment you log a weight, so later weeks can compare.

  }

  function weightRow(a) {
    if (a.cat !== 'str' || isBonus(a) || NOWEIGHT[a.name]) return '';
    var v = (logs[iso(weekStart)] || {})[a.name];
    var sug = recFor(a.name, iso(weekStart));
    var id = esc(a.id);
    return '<div class="wt"><label for="w-' + id + '">Weight used</label>' +
      '<input class="wtin" id="w-' + id + '" type="text" inputmode="decimal" autocomplete="off" min="0" max="500" step="0.25" placeholder="' + esc(sug ? fmtN(sug) : 'kg') + '"' +
      ' data-id="' + id + '" data-name="' + esc(a.name) + '"' + (v ? ' value="' + esc(v) + '"' : '') + '>' +
      '<span class="u">' + unitFor(a.name) + '</span><span class="wh" id="wh-' + id + '">' + esc(hintFor(a.name)) + '</span></div>';
  }

  function allWeeks() {
    var min = iso(todayMon);
    Object.keys(done).concat(Object.keys(logs)).forEach(function (k) {
      if (/^\d{4}-\d{2}-\d{2}$/.test(k) && k < min && k >= START) min = k;
    });
    var out = [], d = weekFromKey(min);
    while (iso(d) <= iso(todayMon)) { out.push(iso(d)); d = addDays(d, 7); }
    return out;
  }

  function weekInfo(k) {
    var dn = done[k] || {}, tot = 0, dc = 0;
    plan.forEach(function (a) { if (isBonus(a)) return; tot++; if (dn[a.id]) dc++; });
    return { total: tot, done: dc, full: tot > 0 && dc === tot };
  }

  function daysComplete(k) {
    var dn = done[k] || {}, t = [0, 0, 0, 0, 0, 0, 0], c = [0, 0, 0, 0, 0, 0, 0], planned = 0, comp = 0, i;
    plan.forEach(function (a) { if (isBonus(a)) return; t[a.day]++; if (dn[a.id]) c[a.day]++; });
    for (i = 0; i < 7; i++) if (t[i] && isTrain(i)) { planned++; if (c[i] === t[i]) comp++; }
    return { planned: planned, comp: comp };
  }

  function streaks() {
    var keys = allWeeks(), run = 0, max = 0, i = keys.length - 1, cur = 0;
    keys.forEach(function (k) {

    });
    if (!weekInfo(keys[i]).full) i--;
    while (i >= 0 && weekInfo(keys[i]).full) { cur++; i--; }
    return { cur: cur, max: max };
  }

  // Session streak: strength sessions in a row. Rest days and bonus days neither add nor break it.
  function sessionList() {
    var out = [], tk = iso(new Date()), cm = coreMap(), endK = iso(addDays(mondayOf(new Date()), 6));
    for (var w = fromIso(START); iso(w) <= endK; w = addDays(w, 7)) {
      var k = iso(w), dn = done[k] || {};
      for (var d = 0; d < 7; d++) {
        if (!cm[d] || !isTrain(d)) continue;
        var acts = plan.filter(function (a) { return a.day === d && !isBonus(a); });
        if (!acts.length) continue;
        var dk = iso(addDays(w, d)), all = acts.every(function (a) { return dn[a.id]; });

      }
    }
    return out;
  }
  function sessionStreak() {
    var l = sessionList(), cur = 0, best = 0;
    l.forEach(function (s) {
      if (s.st === 'done') { cur++; if (cur > best) best = cur; } else if (s.st === 'missed') cur = 0;
    });
    return { cur: cur, best: best, list: l };
  }

  function burn(k) {
    var dn = done[k] || {}, base = 0, extra = 0, n = 0;
    plan.forEach(function (a) {
      if (!dn[a.id]) return;
      var kc = kcalFor(a);
      if (isBonus(a)) { extra += kc; n++; } else base += kc;
    });
    return { base: base, extra: extra, nExtra: n };
  }

  function strengthStats() {
    var byName = {}, rows = [], pcts = [];
    Object.keys(logs).sort().forEach(function (k) {
      var o = logs[k] || {};
      Object.keys(o).forEach(function (name) {
        var v = +o[name];
        if (v > 0) (byName[name] = byName[name] || []).push(v);
      });
    });
    Object.keys(byName).forEach(function (name) {
      var a = byName[name], first = a[0], last = a[a.length - 1];
      rows.push({ name: name, first: first, last: last, n: a.length });
      if (a.length > 1) pcts.push(last / first - 1);
    });
    rows.sort(function (x, y) {
      if ((x.n > 1) !== (y.n > 1)) return x.n > 1 ? -1 : 1;
      return (y.last - y.first) - (x.last - x.first);
    });
    var avg = pcts.length ? pcts.reduce(function (s, p) { return s + p; }, 0) / pcts.length : null;
    return { rows: rows, avg: avg, lifts: pcts.length };
  }

  function liftNames() {
    var seen = {}, out = [];
    plan.forEach(function (a) {
      if (a.cat === 'str' && !isBonus(a) && SPEC[a.name] && !seen[a.name]) { seen[a.name] = 1; out.push(a.name); }
    });
    Object.keys(logs).sort().forEach(function (k) {
      Object.keys(logs[k] || {}).forEach(function (n) { if (!seen[n]) { seen[n] = 1; out.push(n); } });
    });
    return out;
  }

  function chartHtml() {
    var names = liftNames();
    if (!names.length) return '<p class="line">Log a lift on the Workout tab to see it here.</p>';
    if (!chartLift || names.indexOf(chartLift) < 0) {
      chartLift = names.filter(function (n) {
        return Object.keys(logs).some(function (k) { return +((logs[k] || {})[n]) > 0; });
      })[0] || names[0];
    }
    var chips = '<div class="lchips">' + names.map(function (n, i) {
      return '<button type="button" data-act="lift" data-i="' + i + '" aria-pressed="' + (n === chartLift) + '">' + esc(n) + '</button>';
    }).join('') + '</div>';

    // Eight weeks up to now, plus next week.
    var cols = [], i;
    for (i = 7; i >= 0; i--) cols.push(addDays(todayMon, -7 * i));
    cols.push(addDays(todayMon, 7));
    var vals = cols.map(function (d, idx) { return idx < 8 ? (+((logs[iso(d)] || {})[chartLift]) || null) : null; });
    var projIdx = vals[7] ? 8 : 7;
    var projV = SPEC[chartLift] ? (projIdx === 7 ? recFor(chartLift, iso(cols[7])) : suggest(chartLift, iso(cols[8]))) : null;

      n.id = 'nudge'; n.setAttribute('role', 'dialog'); n.setAttribute('aria-modal', 'true'); n.setAttribute('aria-label', 'Session reminder');
      var sk = sessionStreak();
      var line = NUDGE[Math.floor(Math.random() * NUDGE.length)];
      n.innerHTML = '<div class="nc"><div class="na">' + YCROP('strict', '-44 -40 288 330') + '</div><h2>Today\'s session has not started</h2><p>' + esc(line) +
        (sk.cur ? ' Your streak is at ' + sk.cur + (sk.cur === 1 ? ' session.' : ' sessions.') : '') + '</p>' +
        '<div class="nb"><button type="button" class="go">Start the session</button><button type="button" class="later">Later</button></div></div>';
      var close = function () { stopSpeak(); if (n.parentNode) n.parentNode.removeChild(n); };
      n.querySelector('.go').addEventListener('click', function () { close(); showTab('workout'); });
      n.querySelector('.later').addEventListener('click', close);
      n.addEventListener('click', function (e) { if (e.target === n) close(); });
      document.body.appendChild(n);
      speak('Today\'s session has not started. ' + line, 'yes');
      n.querySelector('.go').focus();
    } catch (e) {}
  }
  function nudgeCheck() { if (nudgeDue()) showNudge(); }
  setInterval(nudgeCheck, 10000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) setTimeout(nudgeCheck, 800); });
  setTimeout(nudgeCheck, 2500); setTimeout(nudgeCheck, 8000);

  // The app always opens on Home, whatever the address says.
  showTab('welcome');
  render();
  initStorage();
  if (tab === 'welcome') setTimeout(function () { if (tab === 'welcome') fxWelcome(); }, 400);
})();
</script>
